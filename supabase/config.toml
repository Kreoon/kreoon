# que el caller pertenezca a la organizacion DEL FORMULARIO con un rol
# habilitado — no alcanza con estar logueado.
verify_jwt = true

[functions.client-onboarding-submit]
# Escritura del formulario (guardado por seccion + envio final). Mismo modelo de
# auth que client-onboarding-get: token en el body, sin JWT.
# Rate limit por token+IP via RPC check_rate_limit, payload maximo 100KB,
# strings sanitizados (strip de tags + control chars) antes de persistir.
verify_jwt = false
